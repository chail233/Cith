name: Build Windows desktop

on:
  push:
    branches: [master]
    paths:
      - 'packages/desktop/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - '!packages/**/*.md'
      - '!packages/**/docs/**'
      # 提示词、技能等运行时资源随内置 Core 打包。
      - 'packages/core/prompts/**'
      - 'packages/core/skills/**'
      - 'packages/core/stickers/**'
      - 'packages/core/workspace/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'scripts/copy-assets.js'
      - 'scripts/stage-desktop-core.js'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 设置桌面构建版本
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath packages/desktop/package.json -Raw | ConvertFrom-Json
          $base = [version]::Parse($manifest.version)
          $patch = $base.Build + [int]$env:GITHUB_RUN_NUMBER
          $version = "$($base.Major).$($base.Minor).$patch"

          npm version $version --workspace packages/desktop --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 打包 Windows x64 桌面端和内置 Core
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run bundle:desktop -- --win --x64 --publish never

      - name: 检查安装包中的 Core 和更新配置
        shell: pwsh
        run: |
          $resources = 'packages/desktop/release/win-unpacked/resources'
          $core = Join-Path $resources 'core'
          if (!(Test-Path -LiteralPath (Join-Path $core 'index.js') -PathType Leaf)) {
            throw '安装包缺少内置 Core 入口'
          }
          if (!(Test-Path -LiteralPath (Join-Path $resources 'app-update.yml') -PathType Leaf)) {
            throw '安装包缺少客户端更新配置'
          }

          # 依赖树以单 tar 随包分发（客户端首启解压），按 tar 内容校验依赖闭包
          $tarPath = Join-Path $core 'node_modules.tar'
          if (!(Test-Path -LiteralPath $tarPath -PathType Leaf)) {
            throw '安装包缺少内置 Core 依赖归档 node_modules.tar'
          }
          if (!(Test-Path -LiteralPath (Join-Path $core 'node_modules.tar.json') -PathType Leaf)) {
            throw '安装包缺少 node_modules.tar.json 校验清单'
          }

          $entries = [System.Collections.Generic.HashSet[string]]::new()
          tar -tf $tarPath | ForEach-Object { [void]$entries.Add($_) }
          if ($entries.Count -eq 0) {
            throw 'node_modules.tar 是空的'
          }

          $manifest = Get-Content -LiteralPath packages/core/package.json -Raw | ConvertFrom-Json
          foreach ($name in $manifest.dependencies.PSObject.Properties.Name) {
            if (!$entries.Contains("node_modules/$name/package.json")) {
              throw "安装包缺少内置 Core 的依赖：$name"
            }
          }

      - name: 上传安装包和更新元数据
        uses: actions/upload-artifact@v7
        with:
          name: Cith-Windows-x64-${{ steps.version.outputs.version }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.exe.blockmap
            packages/desktop/release/latest.yml
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: desktop-windows-release
      queue: max

    steps:
      - name: 下载本轮安装包和更新元数据
        uses: actions/download-artifact@v8
        with:
          name: Cith-Windows-x64-${{ needs.build.outputs.version }}
          path: installers

      - name: 发布桌面 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $version = $env:DESKTOP_VERSION
          $tag = "desktop-v$version"
          $setup = "Cith-Setup-$version-x64.exe"
          $assets = foreach ($name in @($setup, "Cith-Portable-$version-x64.exe", "$setup.blockmap", 'latest.yml')) {
            (Get-Item -LiteralPath (Join-Path installers $name)).FullName
          }
          $metadata = Get-Content -LiteralPath installers/latest.yml -Raw
          $hashHex = (Get-FileHash -LiteralPath (Join-Path installers $setup) -Algorithm SHA512).Hash
          $hash = [Convert]::ToBase64String([Convert]::FromHexString($hashHex))
          if ($metadata -notmatch "(?m)^version: $([regex]::Escape($version))\r?$" -or
              $metadata -notmatch "(?m)^path: $([regex]::Escape($setup))\r?$" -or
              $metadata -cnotmatch "(?m)^sha512: $([regex]::Escape($hash))\r?$") {
            throw '更新元数据的版本、文件名或校验值与安装包不符'
          }

          $refsJson = gh api "repos/$env:GH_REPO/git/matching-refs/tags/desktop-v"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $refs = $refsJson | ConvertFrom-Json
          $tagRef = $refs | Where-Object { $_.ref -eq "refs/tags/$tag" }
          if ($tagRef -and $tagRef.object.sha -ne $env:GITHUB_SHA) {
            throw "标签 $tag 已指向其他提交"
          }

          # 较早的构建迟到或重跑时，保留较新版本的 Latest 标记。
          $newerTag = $refs | Where-Object {
            $_.ref -match '^refs/tags/desktop-v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -gt [version]$version
          } | Select-Object -First 1
          $latest = if ($newerTag) { 'false' } else { 'true' }

          $releaseJson = gh release view $tag --json isDraft,targetCommitish,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (!$tagRef -and $release.targetCommitish -ne $env:GITHUB_SHA) {
              throw "Release $tag 已指向其他提交"
            }
            if (!$release.isDraft) {
              Write-Output "已发布 ${tag}：$($release.url)"
              exit 0
            }

            # 首次上传中断时，GitHub CLI 可能已创建草稿，用同一构建产物补齐后发布。
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false "--latest=$latest"
            exit $LASTEXITCODE
          }

          gh release create $tag @assets --target $env:GITHUB_SHA --title "Cith Desktop $version" --generate-notes "--latest=$latest"
          exit $LASTEXITCODE
